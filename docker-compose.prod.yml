# Production stack. Pulls prebuilt images instead of building, and publishes
# no ports: the server's existing nginx is the only thing facing the internet.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Values come from a .env file sitting next to this one on the server.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      # No default: Compose refuses to start if this is missing, rather than
      # running with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      # Internal only. The shared network already has a container answering to
      # "postgres", and two containers with one name is a coin flip.
      internal:
        aliases:
          - rag-postgres

  redis:
    image: redis:7-alpine
    # maxmemory plus an eviction policy is the part that matters on a shared
    # server: Redis drops the least recently used entries instead of growing
    # until the host runs out of memory.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      # Private network only. An unauthenticated Redis reachable from the
      # shared network would be an open door.
      internal:
        aliases:
          - rag-redis

  api:
    # TAG is a commit hash in a real deploy, which is what makes rollback
    # a matter of changing one value and restarting.
    image: ghcr.io/${OWNER:?set OWNER in .env}/rag-api:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@rag-postgres:5432/${POSTGRES_DB:-rag}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env}
      REDIS_URL: redis://rag-redis:6379/0
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-rag-at-scale}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      DATA_DIR: /app/data
    volumes:
      # The corpus PDFs, copied to the server with rsync rather than baked into
      # the image: data/ is not in git, so CI cannot put them there, and an
      # 80 MB corpus in every image would slow each deploy.
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # Both: the database over the private network, nginx over the shared one.
      internal:
      edge:
        aliases:
          - rag-api

  web:
    image: ghcr.io/${OWNER:?set OWNER in .env}/rag-web:${TAG:-latest}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - rag-web

networks:
  # Created by this project, reachable only by its own containers.
  internal:
  # Created by the blog's compose project. "external" means use the existing
  # one rather than making another.
  edge:
    external: true
    name: blog_default

volumes:
  pgdata:
  redisdata:
