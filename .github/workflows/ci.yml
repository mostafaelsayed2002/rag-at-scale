name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Buildx is the builder that supports the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root, so the workspace
          # lockfile is reachable from api/Dockerfile.
          context: .
          file: api/Dockerfile
          # Load into the runner instead of pushing anywhere.
          load: true
          tags: rag-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: rag-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
