name: CD

on:
  push:
    branches: [main]

# Two pushes in quick succession would otherwise race, and the loser could
# leave the server running the older image. Queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the built-in token push to the container registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          # The commit tag is what makes a rollback possible.
          tags: |
            ghcr.io/${{ vars.OWNER }}/rag-api:${{ github.sha }}
            ghcr.io/${{ vars.OWNER }}/rag-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/${{ vars.OWNER }}/rag-web:${{ github.sha }}
            ghcr.io/${{ vars.OWNER }}/rag-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to the server
    needs: publish
    runs-on: ubuntu-latest
    # A deploy that hangs on SSH should fail rather than burn the job limit.
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Load the deploy key
        # The key has no passphrase, since nothing can type one here.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy the compose file and migrations
        run: |
          ssh root@${{ vars.SERVER_HOST }} 'mkdir -p /opt/rag/db/migrations'
          scp docker-compose.prod.yml root@${{ vars.SERVER_HOST }}:/opt/rag/
          scp db/migrations/*.sql root@${{ vars.SERVER_HOST }}:/opt/rag/db/migrations/

      - name: Pull and restart
        # Values are passed inline rather than written to a file, so nothing
        # durable holds the password. The cost is that a manual restart on the
        # server needs the same variables supplied by hand.
        run: |
          ssh root@${{ vars.SERVER_HOST }} "
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ vars.OWNER }}' --password-stdin &&
            cd /opt/rag &&
            export OWNER='${{ vars.OWNER }}' \
                   POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
                   TAG='${{ github.sha }}' &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d &&
            docker image prune -f
          "

      - name: Check the site responds
        # Containers need a few seconds to accept connections, so retry
        # rather than guessing how long to wait.
        run: |
          curl -fsS --retry 15 --retry-delay 3 --retry-all-errors \
            -o /dev/null "https://${{ vars.SITE_DOMAIN }}/api/health"
