name: CD

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the built-in token push to the container registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase, GitHub usernames need not be.
      - name: Normalise owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          # The commit tag is what makes a rollback possible.
          tags: |
            ghcr.io/${{ env.OWNER }}/rag-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rag-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/${{ env.OWNER }}/rag-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/rag-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
