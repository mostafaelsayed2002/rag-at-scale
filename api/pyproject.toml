[project]
name = "rag-api"
version = "0.1.0"
description = "RAG at scale: retrieval and answer generation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    # Gemini writes the answers.
    "langchain-google-genai>=4.4.0",
    "langsmith>=0.12.5",
    "numpy>=2.4.6",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Shared response and embedding cache. The client speaks asyncio natively,
    # which the endpoints need.
    "redis>=5.2.1",
    # Questions are embedded in-process with the same model as the corpus
    # (bge-base-en-v1.5): ~30 ms on CPU, no network call, no quota.
    "sentence-transformers>=5",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
eval = [
    "instructor>=1.10",
    "ragas>=0.4.3",
]
