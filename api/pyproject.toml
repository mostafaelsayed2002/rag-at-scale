[project]
name = "rag-api"
version = "0.1.0"
description = "RAG at scale: retrieval and answer generation API"
requires-python = ">=3.11"
dependencies = [
    "datetime>=6.0",
    "fastapi>=0.141.1",
    # Queries are embedded in-process with the same model the corpus used.
    "fastembed>=0.4",
    "langsmith>=0.12.5",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
