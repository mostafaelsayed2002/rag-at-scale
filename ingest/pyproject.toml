[project]
name = "rag-ingest"
version = "0.1.0"
description = "RAG at scale: corpus download, chunking, and batched embedding"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pymupdf>=1.28.2",
    "langchain-text-splitters>=1.1.2",
    "tokenizers>=0.23.2",
    "numpy>=2.4.6",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "rich>=14",
    # PyTorch, for embedding on the M1 GPU: ~10x faster than the ONNX model in
    # fastembed on this machine, which would take days for a million chunks.
    "sentence-transformers>=5",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
