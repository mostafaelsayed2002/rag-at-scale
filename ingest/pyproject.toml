[project]
name = "rag-ingest"
version = "0.1.0"
description = "RAG at scale: corpus download, chunking, and batched embedding"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=0.3",
    # ONNX runtime rather than PyTorch: same model, a few hundred MB not two GB.
    "fastembed>=0.4",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false
