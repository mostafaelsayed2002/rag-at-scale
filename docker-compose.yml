services:
  postgres:
    image: pgvector/pgvector:pg16 # Use the official PostgreSQL 16 image with pgvector extension just enable it 
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly writes each change to a log, so a restart does not empty the
    # cache. Not critical for a cache, but it keeps the first requests after a
    # deploy from all being misses.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Development only, like Postgres above: so an API started with uvicorn
      # on the host can reach it. The production file publishes nothing.
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # Host is the service name, not localhost: inside the network each
      # service is reachable by name, and localhost means this container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      # Queries are embedded with the same model the corpus used.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Again the service name: redis answers to it inside the network.
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
    volumes:
      # The corpus itself, so a citation can open the original PDF. Read-only:
      # the API serves these files and must never modify them.
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      # Waits for the healthcheck to pass, not just for the container to start.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the bundle at build time. The browser makes this call
        # from your machine, so it is the published port, not the service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Development only. Never added to docker-compose.prod.yml: a database
  # console on a public server is a liability, and the SSH tunnel covers it.
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      # Single-user mode, so it does not ask for a master password every start.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin:
  redisdata:
